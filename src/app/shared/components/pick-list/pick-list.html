<div class="card p-4">
  <p-picklist [showTargetControls]="false" [showSourceControls]="false" [source]="sourceProducts()"
    [target]="targetProducts()" [dragdrop]="true" [responsive]="true" filterBy="name"
    sourceFilterPlaceholder="Search by name" targetFilterPlaceholder="Search by name" breakpoint="1400px"
    scrollHeight="20rem" [ngClass]="{ 'hide-specific-button': hideMoveAllButton }"
    (onSourceSelect)="onSourceSelect($event)" (onMoveToTarget)="onMoveToTarget($event)"
    (onMoveToSource)="onMoveToSource($event)">
    <ng-template let-option let-selected="selected" #option>
      <div class="flex flex-wrap p-2 items-center gap-4 w-full">
        <div class="flex-1 flex flex-col">
          <span class="font-medium text-sm">{{ option.name }}</span>
        </div>
      </div>
    </ng-template>
  </p-picklist>
</div>
