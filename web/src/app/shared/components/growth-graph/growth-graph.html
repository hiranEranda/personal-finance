<div class="glass-panel p-6 rounded-xl flex flex-col" style="height: 420px;">
  <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 border-b border-gray-100 dark:border-gray-700 pb-4">
    <div class="mb-4 md:mb-0">
      <h2 class="text-lg font-bold token-text-primary">Portfolio Growth</h2>
      <p class="text-sm token-text-muted">Invested Capital vs Current Value</p>
    </div>
    <div class="flex space-x-1 bg-gray-50 dark:bg-gray-800 p-1 rounded-lg overflow-x-auto">
      @for (range of timeRanges; track range) {
        <button
          (click)="selectRange(range)"
          [class]="selectedRange() === range
            ? 'px-3 py-1 text-xs font-medium rounded-md whitespace-nowrap bg-white dark:bg-gray-700 shadow-sm token-text-primary'
            : 'px-3 py-1 text-xs font-medium rounded-md whitespace-nowrap token-text-muted hover:bg-gray-200 dark:hover:bg-gray-700 transition-all'"
        >{{ range }}</button>
      }
    </div>
  </div>
  <div class="flex-grow min-h-0">
    <p-chart type="line" [data]="chartData()" [options]="chartOptions()" width="100%" height="100%"></p-chart>
  </div>
</div>
