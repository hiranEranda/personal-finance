<nav class="app-nav fixed w-full z-20 top-0 start-0">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-4 py-3">
    <a routerLink="/home" class="flex items-center gap-3">
      <div class="app-nav-logo">PF</div>
      <div class="leading-tight">
        <span class="block text-[15px] font-extrabold tracking-tight text-heading">Personal Finance</span>
        <span class="app-nav-sub">Funds · Shares · Fixed Deposits</span>
      </div>
    </a>

    <div class="flex items-center gap-2 md:order-2">
      <button
        (click)="toggleDarkMode()"
        type="button"
        class="app-nav-icon-btn"
        aria-label="Toggle dark mode"
      >
        @if (themeService.darkMode()) {
          <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4" />
            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        }
      </button>
      <button
        (click)="toggleMenu()"
        type="button"
        class="app-nav-icon-btn md:hidden"
        aria-controls="navbar-default"
        [attr.aria-expanded]="isMenuOpen()"
      >
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/>
        </svg>
      </button>
    </div>

    <div [class.hidden]="!isMenuOpen()" class="w-full md:block md:w-auto md:order-1" id="navbar-default">
      <ul class="flex flex-col gap-1 mt-3 md:mt-0 md:flex-row md:items-center md:gap-1.5">
        <li><a routerLink="/home" routerLinkActive="app-tab-active" class="app-tab">Dashboard</a></li>
        <li><a routerLink="/funds" routerLinkActive="app-tab-active" class="app-tab">Funds</a></li>
        <li><a routerLink="/shares" routerLinkActive="app-tab-active" class="app-tab">Shares</a></li>
        <li><a routerLink="/fixed-deposits" routerLinkActive="app-tab-active" class="app-tab">Fixed Deposits</a></li>
        <li class="app-nav-divider" aria-hidden="true"></li>
        <li><a routerLink="/documents" routerLinkActive="app-tab-active" class="app-tab">Docs</a></li>
        <li><a routerLink="/chat" routerLinkActive="app-tab-active" class="app-tab">AI Chat</a></li>
        <li><a routerLink="/login" class="app-tab">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="mt-20 mx-auto max-w-screen-xl px-4 py-6">
  <router-outlet />
</div>
